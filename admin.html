<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — PremLal Technologies</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#05060F; --bg-2:#0A0C1B; --bg-3:#0F1226;
  --iris:#6C63FF; --violet:#8B5CF6; --cyan:#06B6D4; --marigold:#F59E0B; --red:#F87171; --green:#34D399;
  --text:#EDEFFB; --dim:#9AA0C3; --faint:#5A6080;
  --glass:rgba(255,255,255,.045); --glass-brd:rgba(255,255,255,.09);
  --grad:linear-gradient(120deg,#6C63FF,#8B5CF6 40%,#06B6D4 90%);
  --r:14px; --r-lg:20px;
  --disp:'Space Grotesk',sans-serif; --body:'Manrope',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;min-height:100svh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
::selection{background:rgba(108,99,255,.35)}
.glass{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r-lg);backdrop-filter:blur(14px)}

/* ---- Login ---- */
#login-screen{min-height:100svh;display:grid;place-items:center;padding:20px}
.login-card{width:min(380px,92vw);padding:38px 32px;text-align:center}
.login-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,#101433,#0A0C1B);border:1px solid var(--glass-brd);display:grid;place-items:center}
.login-card h1{font-family:var(--disp);font-size:1.3rem;margin-bottom:6px}
.login-card p{color:var(--dim);font-size:.88rem;margin-bottom:26px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:7px;font-weight:600}
.inp{width:100%;padding:12px 15px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--iris)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:700;font-size:.92rem;width:100%;transition:transform .2s,opacity .2s}
.btn-primary{background:var(--grad);background-size:180% auto;color:#fff}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-err{display:none;margin-top:14px;padding:10px;border-radius:10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:var(--red);font-size:.85rem}

/* ---- App shell ---- */
#app{display:none;min-height:100svh}
header.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(10,12,27,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-brd)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:1rem}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#101433,#0A0C1B);border:1px solid var(--glass-brd);display:grid;place-items:center}
.topbar-right{display:flex;align-items:center;gap:14px}
.who{font-size:.82rem;color:var(--dim)}
.logout{padding:9px 16px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-brd);font-size:.85rem;font-weight:600;transition:border-color .2s}
.logout:hover{border-color:var(--red)}

main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat{padding:18px 20px;border-radius:var(--r)}
.stat .n{font-family:var(--disp);font-size:1.7rem;font-weight:700}
.stat .l{color:var(--dim);font-size:.8rem;margin-top:2px}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
#search{width:100%;padding:11px 15px 11px 40px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-brd);color:var(--text);font-size:.9rem;outline:none}
#search:focus{border-color:var(--iris)}
.filter-chips{display:flex;gap:8px}
.chip{padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-brd);font-size:.82rem;font-weight:600;color:var(--dim);transition:.2s}
.chip.active{color:#fff;border-color:transparent;background:var(--grad)}
.refresh-btn{padding:9px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-brd);display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
.refresh-btn:hover{border-color:var(--cyan)}
.refresh-btn svg{transition:transform .4s}
.refresh-btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#list{display:flex;flex-direction:column;gap:10px}
.row{padding:18px 20px;border-radius:var(--r);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;transition:border-color .2s}
.row:hover{border-color:rgba(108,99,255,.35)}
.row.new{border-left:3px solid var(--cyan)}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:.95rem;flex-shrink:0}
.row-main{min-width:0}
.row-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.row-name{font-weight:700;font-size:.98rem}
.row-email{color:var(--cyan);font-size:.82rem}
.row-time{color:var(--faint);font-size:.75rem;font-family:var(--mono);margin-left:auto}
.row-msg{color:var(--dim);font-size:.9rem;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-msg.expanded{-webkit-line-clamp:unset}
.row-msg-toggle{color:var(--iris);font-size:.78rem;font-weight:600;margin-top:5px;display:inline-block}
.badge{padding:4px 11px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge.new{background:rgba(6,182,212,.12);color:var(--cyan);border:1px solid rgba(6,182,212,.3)}
.badge.read{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--glass-brd)}
.badge.replied{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.row-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.act-row{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:9px;background:var(--glass);border:1px solid var(--glass-brd);display:grid;place-items:center;transition:.2s}
.icon-btn:hover{border-color:var(--iris)}
.icon-btn.danger:hover{border-color:var(--red)}
.icon-btn.success:hover{border-color:var(--green)}

.empty{text-align:center;padding:70px 20px;color:var(--faint)}
.empty svg{margin:0 auto 16px;opacity:.4}
.loading{text-align:center;padding:60px;color:var(--dim);font-size:.9rem}

@media(max-width:680px){
  .row{grid-template-columns:auto 1fr}
  .row-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;margin-top:8px}
  .row-time{margin-left:0;width:100%}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card glass">
    <div class="login-logo">
      <svg width="26" height="26" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C63FF"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><path d="M14 34 V14 h12 a8 8 0 0 1 0 16 h-8" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Admin Panel</h1>
    <p>PremLal Technologies — Contact submissions</p>
    <form id="login-form">
      <div class="field"><label for="lemail">Email</label><input class="inp" id="lemail" type="email" placeholder="you@premlal.tech" required /></div>
      <div class="field"><label for="lpass">Password</label><input class="inp" id="lpass" type="password" placeholder="••••••••" required /></div>
      <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 48 48"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C63FF"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><path d="M14 34 V14 h12 a8 8 0 0 1 0 16 h-8" fill="none" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      PremLal Admin
    </div>
    <div class="topbar-right">
      <span class="who" id="who-email"></span>
      <button class="logout" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat glass"><div class="n" id="stat-total">0</div><div class="l">Total messages</div></div>
      <div class="stat glass"><div class="n" id="stat-new">0</div><div class="l">New</div></div>
      <div class="stat glass"><div class="n" id="stat-replied">0</div><div class="l">Replied</div></div>
      <div class="stat glass"><div class="n" id="stat-today">0</div><div class="l">Today</div></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="Search by name, email, or message…" />
      </div>
      <div class="filter-chips" id="filter-chips">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="new">New</button>
        <button class="chip" data-f="read">Read</button>
        <button class="chip" data-f="replied">Replied</button>
      </div>
      <button class="refresh-btn" id="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
        Refresh
      </button>
    </div>

    <div id="list"></div>
  </main>
</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL='https://wyjcddqdusxfkdbfxkok.supabase.co/';       // same project as index.html
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5amNkZHFkdXN4ZmtkYmZ4a29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjk4NzUsImV4cCI6MjEwMDc0NTg3NX0.lVVMqCSQyWUaM4t-zR6256v_QUl7bgcmIrU3LOwnjRk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ================= STATE ================= */
let ALL_ROWS=[];
let CURRENT_FILTER='all';

/* ================= AUTH ================= */
const loginScreen=document.getElementById('login-screen');
const appEl=document.getElementById('app');
const loginForm=document.getElementById('login-form');
const loginErr=document.getElementById('login-err');
const loginBtn=document.getElementById('login-btn');

async function checkSession(){
  const{data:{session}}=await sb.auth.getSession();
  if(session){showApp(session)}else{showLogin()}
}
function showLogin(){loginScreen.style.display='grid';appEl.style.display='none'}
function showApp(session){
  loginScreen.style.display='none';appEl.style.display='block';
  document.getElementById('who-email').textContent=session.user.email;
  loadContacts();
}

loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  loginErr.style.display='none';
  const email=document.getElementById('lemail').value.trim();
  const password=document.getElementById('lpass').value;
  loginBtn.disabled=true;loginBtn.textContent='Signing in…';
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  loginBtn.disabled=false;loginBtn.textContent='Sign in';
  if(error){loginErr.textContent=error.message;loginErr.style.display='block';return}
  showApp(data.session);
});

document.getElementById('logout-btn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  showLogin();
});

/* ================= DATA ================= */
async function loadContacts(){
  const list=document.getElementById('list');
  list.innerHTML='<div class="loading">Loading messages…</div>';
  const{data,error}=await sb.from('contacts').select('*').order('created_at',{ascending:false});
  if(error){
    list.innerHTML=`<div class="empty">Couldn't load messages.<br><span style="font-size:.8rem">${escapeHtml(error.message)}</span></div>`;
    return;
  }
  ALL_ROWS=data||[];
  updateStats();
  renderList();
}

function updateStats(){
  const total=ALL_ROWS.length;
  const newCount=ALL_ROWS.filter(r=>(r.status||'new')==='new').length;
  const repliedCount=ALL_ROWS.filter(r=>r.status==='replied').length;
  const todayStr=new Date().toDateString();
  const today=ALL_ROWS.filter(r=>new Date(r.created_at).toDateString()===todayStr).length;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-new').textContent=newCount;
  document.getElementById('stat-replied').textContent=repliedCount;
  document.getElementById('stat-today').textContent=today;
}

function renderList(){
  const list=document.getElementById('list');
  const q=document.getElementById('search').value.trim().toLowerCase();
  let rows=ALL_ROWS;
  if(CURRENT_FILTER!=='all'){rows=rows.filter(r=>(r.status||'new')===CURRENT_FILTER)}
  if(q){rows=rows.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.email||'').toLowerCase().includes(q)||(r.message||'').toLowerCase().includes(q))}

  if(!rows.length){
    list.innerHTML=`<div class="empty">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      No messages found.
    </div>`;
    return;
  }

  list.innerHTML=rows.map(r=>{
    const status=r.status||'new';
    const initials=(r.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const time=new Date(r.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    return `
    <div class="row glass ${status==='new'?'new':''}" data-id="${r.id}">
      <div class="avatar">${escapeHtml(initials)}</div>
      <div class="row-main">
        <div class="row-top">
          <span class="row-name">${escapeHtml(r.name||'Unknown')}</span>
          <span class="row-email">${escapeHtml(r.email||'')}</span>
          <span class="badge ${status}">${status}</span>
          <span class="row-time">${time}</span>
        </div>
        <div class="row-msg" id="msg-${r.id}">${escapeHtml(r.message||'')}</div>
        <span class="row-msg-toggle" data-toggle="${r.id}">Read more</span>
      </div>
      <div class="row-actions">
        <div class="act-row">
          ${status!=='read'?`<button class="icon-btn" title="Mark as read" data-action="read" data-id="${r.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>`:''}
          ${status!=='replied'?`<button class="icon-btn success" title="Mark as replied" data-action="replied" data-id="${r.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>`:''}
          <a class="icon-btn" title="Reply by email" href="mailto:${encodeURIComponent(r.email||'')}?subject=${encodeURIComponent('Re: your message to PremLal Technologies')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg></a>
          <button class="icon-btn danger" title="Delete" data-action="delete" data-id="${r.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6h10z"/></svg></button>
        </div>
      </div>
    </div>`;
  }).join('');

  // read-more toggles
  list.querySelectorAll('[data-toggle]').forEach(t=>{
    t.addEventListener('click',()=>{
      const id=t.dataset.toggle;
      const msg=document.getElementById('msg-'+id);
      msg.classList.toggle('expanded');
      t.textContent=msg.classList.contains('expanded')?'Show less':'Read more';
    });
  });
  // actions
  list.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>handleAction(btn.dataset.action,btn.dataset.id));
  });
}

async function handleAction(action,id){
  if(action==='delete'){
    if(!confirm('Delete this message permanently?'))return;
    const{error}=await sb.from('contacts').delete().eq('id',id);
    if(error){alert('Could not delete: '+error.message);return}
    ALL_ROWS=ALL_ROWS.filter(r=>r.id!==id);
    updateStats();renderList();
    return;
  }
  const status=action; // 'read' or 'replied'
  const{error}=await sb.from('contacts').update({status}).eq('id',id);
  if(error){alert('Could not update: '+error.message);return}
  const row=ALL_ROWS.find(r=>r.id===id);
  if(row)row.status=status;
  updateStats();renderList();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ================= UI EVENTS ================= */
document.getElementById('search').addEventListener('input',renderList);
document.getElementById('filter-chips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  document.querySelectorAll('#filter-chips .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  CURRENT_FILTER=btn.dataset.f;
  renderList();
});
document.getElementById('refresh-btn').addEventListener('click',async()=>{
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spin');
  await loadContacts();
  setTimeout(()=>btn.classList.remove('spin'),400);
});

/* ================= INIT ================= */
checkSession();
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT')showLogin();
});
</script>
</body>
</html>
